name: Alembic Integrity Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  alembic-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pontis_ci
          POSTGRES_USER: pontis
          POSTGRES_PASSWORD: pontis
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pontis -d pontis_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg2://pontis:pontis@127.0.0.1:5432/pontis_ci
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Alembic integrity
        run: python backend/scripts/check_alembic_integrity.py

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
